<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenLibrary AI Book Assistant</title>
    <link rel="stylesheet" href="chat.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
    /* Hard override — guarantees full screen on file:// */
    html, body {
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    .app-shell {
      position: fixed;
      inset: 0;          /* top:0 right:0 bottom:0 left:0 */
      display: flex;
      flex-direction: column;
    }
    .body-columns {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 240px 1fr 240px;
      overflow: hidden;
    }
  </style>
  </head>
  <body>
    <div class="app-shell">

      <!-- ── Top Bar ───────────────────────────────────────────── -->
      <header class="topbar">
        <div class="brand">
          <span class="brand-icon">🎀</span>
          <span class="brand-name">QuynhNhiVu</span>
        </div>
          <span class="brand-sub">AI Book Retrieval</span>
          <button class="logout-btn" id="logoutBtn">Logout</button>
      </header>

    <!-- ── 3-Column Body ─────────────────────────────────────── -->
    <div class="body-columns">
 
      <!-- LEFT: Conversation History -->
      <aside class="sidebar sidebar-left">
        <div class="sidebar-header">
          <span class="sidebar-title">Conversations</span>
          <button class="new-chat-btn" id="newChatBtn" title="New conversation">＋ New</button>
        </div>
        <div class="conv-list" id="convList">
          <p class="sidebar-empty">No conversations yet.</p>
        </div>
      </aside>
 
      <!-- CENTER: Chat -->
      <main class="chat-column">
        <div class="chat-area" id="chatArea">
          <div class="welcome">
            <p class="welcome-hint">Ask me anything about books —<br>by genre, rating, author, or theme.</p>
          </div>
        </div>

        <div class="quick-actions" aria-label="Quick actions">
          <div class="quick-actions-label">✨ Quick Actions</div>
          <div class="quick-actions-list" id="quickActionsList"></div>
        </div>
 
        <div class="input-bar">
          <textarea
            id="userInput"
            class="input-field"
            placeholder="e.g. Find history books rated above 4…"
            rows="1"
            autocomplete="off"
            spellcheck="false"
          ></textarea>
          <button id="sendBtn" class="send-btn" aria-label="Send">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </div>
      </main>
 
      <!-- RIGHT: Bookmarks -->
      <aside class="sidebar sidebar-right">
        <div class="sidebar-header">
          <span class="sidebar-title">Bookmarks</span>
          <button class="refresh-btn" id="refreshBookmarks" title="Refresh">↻</button>
        </div>
        <div class="bookmark-list" id="bookmarkList">
          <p class="sidebar-empty">Loading bookmarks…</p>
        </div>
      </aside>
 
    </div>
  </div>
 
  <script src="auth.js"></script>
  <script src="chat.js"></script>
  <script src="sidebar.js"></script>
</body>
</html>

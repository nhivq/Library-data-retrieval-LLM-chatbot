<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpenLibrary AI Book Assistant</title>
  <link rel="stylesheet" href="chat.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="shell">

    <header class="topbar">
      <div class="brand">
        <span class="brand-icon">🎀</span>
        <span class="brand-name">QuynhNhiVu</span>
      </div>
      <div style="display:flex;align-items:center;gap:16px;">
        <span class="brand-sub">AI Book Retrieval</span>
        <button class="logout-btn" id="logoutBtn">Logout</button>
      </div>
    </header>

    <main class="chat-area" id="chatArea">
      <div class="welcome">
        <p class="welcome-hint">Ask me anything about books — by genre, rating, author, or theme.</p>
      </div>
    </main>

    <footer class="input-bar">
      <textarea
        id="userInput"
        class="input-field"
        placeholder="e.g. Find history books rated above 4…"
        rows="1"
        autocomplete="off"
        spellcheck="false"
      ></textarea>
      <button id="sendBtn" class="send-btn" aria-label="Send">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </footer>

  </div>
  <script src="auth.js"></script>
  <script src="chat.js"></script>
</body>
</html>

services:
  - type: web
    name: library-data-retrieval-llm-chatbot
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    autoDeploy: true
    envVars:
      - key: OPENROUTER_API_KEY
        value: ""
      - key: DATABASE_URL
        value: ""

databases:
  - name: book-db
    databaseName: book_db
    user: book_user
    plan: free
    
